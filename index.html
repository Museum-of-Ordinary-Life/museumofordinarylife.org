<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="The Museum of Ordinary Life is a living archive of everyday life, established in 2026."><meta name="color-scheme" content="light dark"><meta name="theme-color" id="theme-color" content="#f4f1e8"><script>
(() => {
  try {
    const savedTheme = localStorage.getItem('mol-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('#theme-color')?.setAttribute('content', savedTheme === 'dark' ? '#171713' : '#f4f1e8');
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      document.querySelector('#theme-color')?.setAttribute('content', '#171713');
    }
  } catch (_) {}
})();
</script><title>Museum of Ordinary Life</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/enhancements.css"></head><body id="top">
