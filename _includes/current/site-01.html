<!doctype html>
<html lang="en">
<head>
<!-- MOL / DIGITAL TRACE / SOURCE / 2026 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="The Museum of Ordinary Life documents ordinary human life as it is lived: objects, rooms, interfaces, routines, paperwork, sounds, stories, and the context around them. Established 2026.">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="https://museumofordinarylife.org/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color" content="#f4f1e8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script>
(() => {
  try {
    const savedTheme = localStorage.getItem('mol-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('#theme-color')?.setAttribute('content', savedTheme === 'dark' ? '#171713' : '#f4f1e8');
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      document.querySelector('#theme-color')?.setAttribute('content', '#171713');
    }
  } catch (_) {}
})();
</script>
<title>Museum of Ordinary Life</title>

<style>
:root{
  --paper:#f4f1e8;
  --paper2:#e9e4d8;
  --ink:#141414;
  --muted:#66635d;
  --rule:#171717;
  --soft-rule:#b8b2a7;
  --blue:#2454ff;
  --acid:#d9ff49;
  --max:1480px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input,textarea{font:inherit}
.wrap{
  width:min(calc(100% - 44px),var(--max));
  margin:0 auto;
}

/* ---------- utility ---------- */

.utility{
  border-bottom:1px solid var(--rule);
  font-size:12px;
}
.utility .wrap{
  min-height:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}
.utility-left{
  display:flex;
  align-items:center;
  gap:20px;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.live:before{
  content:"";
  width:8px;
  height:8px;
  background:var(--acid);
  border:1px solid var(--ink);
  border-radius:50%;
}
.year-marker{
  background:var(--acid);
  padding:2px 5px 1px;
  font-weight:700;
}

/* ---------- header ---------- */

header{
  border-bottom:1px solid var(--rule);
  position:relative;
  z-index:20;
}
.header-row{
  min-height:112px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:clamp(24px,3vw,48px);
  padding:17px 0 18px;
}
.wordmark{
  text-decoration:none;
  max-width:none;
  min-width:0;
  flex:1 1 auto;
}
.wordmark .the{
  display:block;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-bottom:4px;
}
.wordmark .name{
  display:block;
  white-space:nowrap;
  font-size:clamp(2.4rem,4.35vw,5.8rem);
  line-height:.82;
  font-weight:800;
  letter-spacing:-.065em;
}
.main-nav{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:nowrap;
  justify-content:flex-end;
  flex:0 0 auto;
  font-size:14px;
  font-weight:700;
}
.main-nav > a,
.nav-more summary{
  color:inherit;
  background:none;
  border:0;
  text-decoration:none;
  border-bottom:2px solid transparent;
  padding:0 0 3px;
  cursor:pointer;
  font:inherit;
  font-weight:700;
}
.main-nav > a:hover,
.nav-more summary:hover{border-color:var(--blue)}

.main-nav a:focus-visible,
.nav-more summary:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:4px;
}

.nav-more{
  position:relative;
}

.nav-more summary{
  display:inline-flex;
  align-items:center;
  gap:6px;
  list-style:none;
}

.nav-more summary::-webkit-details-marker{display:none}
.nav-more summary::after{
  content:"+";
  font-size:1.05em;
  font-weight:400;
}
.nav-more[open] summary::after{content:"−"}

.nav-more-menu{
  position:absolute;
  z-index:30;
  top:calc(100% + 12px);
  right:0;
  width:max-content;
  min-width:190px;
  padding:7px 12px;
  border:1px solid var(--rule);
  background:var(--paper);
  box-shadow:4px 4px 0 var(--ink);
}

.nav-more-menu a{
  display:block;
  padding:9px 2px 8px;
  border-bottom:1px solid var(--soft-rule);
  color:inherit;
  text-decoration:none;
  white-space:nowrap;
}
.nav-more-menu a:last-child{border-bottom:0}
.nav-more-menu a:hover{color:var(--blue)}

.nav-more-menu .nav-compact-only,
.nav-more-label-compact{display:none}


/* ---------- wordmark refinement: italic serif "of" ---------- */

.wordmark-of{
  font-family:Georgia,"Times New Roman",serif;
  font-size:1em;
  font-style:italic;
  font-weight:400;
  letter-spacing:-.045em;
  text-transform:none;
}


@media(max-width:1100px){
  .wordmark .name{
    font-size:clamp(2.25rem,4.15vw,3.6rem);
  }
}

@media(max-width:980px){
  .main-nav > .nav-primary{display:none}
  .nav-more-menu .nav-compact-only{display:block}
  .nav-more-label-wide{display:none}
  .nav-more-label-compact{display:inline}
}

@media(max-width:850px){
  .wordmark{
    width:auto;
    flex:1 1 auto;
  }

}

@media(max-width:560px){
  .wordmark .name{
    font-size:clamp(1.25rem,5.8vw,2.2rem);
    letter-spacing:-.07em;
  }

  .header-row{gap:12px}
  .main-nav{font-size:13px}
  .nav-more-menu{
    max-width:calc(100vw - 26px);
  }
}

/* ---------- hero ---------- */

.hero{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);
  gap:50px;
  min-height:630px;
  padding:48px 0 46px;
  border-bottom:1px solid var(--rule);
}
.hero-main{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.hero h1{
  margin:0;
  max-width:1030px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(4rem,8.6vw,9.5rem);
  line-height:.87;
  letter-spacing:-.062em;
  font-weight:400;
}
.hero h1 .ordinary{
  text-decoration:underline;
  text-decoration-thickness:.055em;
  text-underline-offset:.08em;
  text-decoration-color:var(--blue);
}
.hero-caption{
  display:flex;
  justify-content:space-between;
  gap:30px;
  margin-top:52px;
  max-width:980px;
  font-size:12px;
}
.hero-caption p{
  margin:0;
  max-width:410px;
  line-height:1.45;
}
.hero-side{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:44px;
  border-left:1px solid var(--rule);
  padding-left:25px;
}
.mission{
  margin:0;
  font-size:clamp(1.5rem,2.4vw,2.5rem);
  line-height:1.05;
  letter-spacing:-.035em;
}
.open-call{
  border-top:5px solid var(--ink);
  padding-top:14px;
}
.kicker{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:700;
}
.open-call h2{
  margin:10px 0 12px;
  font-size:clamp(1.6rem,3vw,3.2rem);
  line-height:.95;
  letter-spacing:-.045em;
}
.open-call p{
  margin:0 0 18px;
  max-width:440px;
  font-size:15px;
  line-height:1.45;
}
.text-link{
  display:inline-block;
  font-weight:700;
  text-decoration:none;
  border-bottom:2px solid var(--blue);
}
.text-link:hover{
  background:var(--action-blue);
  color:#fff;
}

/* ---------- ticker ---------- */

.notice{
  background:var(--action-blue);
  color:#fff;
  border-bottom:1px solid var(--ink);
}
.notice .wrap{
  min-height:47px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  font-size:14px;
}
.notice strong{
  text-transform:uppercase;
  letter-spacing:.03em;
}
.notice a{
  font-weight:700;
  text-decoration:none;
}
.notice a:hover{text-decoration:underline}

/* ---------- general ---------- */

.section{
  padding:70px 0 82px;
  border-bottom:1px solid var(--rule);
}
.section-title{
  display:grid;
  grid-template-columns:1fr 2.2fr;
  gap:30px;
  margin-bottom:48px;
}
.section-title .kicker{
  padding-top:8px;
}
.section-title h2{
  margin:0;
  max-width:1100px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(3rem,6.3vw,7rem);
  line-height:.91;
  letter-spacing:-.055em;
  font-weight:400;
}
.section-title h2 strong{
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  letter-spacing:-.065em;
}

/* ---------- why ---------- */

.why-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--rule);
  border-left:1px solid var(--rule);
}
.why{
  min-height:300px;
  border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.why .number{
  font-size:11px;
  font-weight:700;
}
.why h3{
  margin:45px 0 12px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(2rem,3.7vw,4rem);
  line-height:.94;
  letter-spacing:-.04em;
  font-weight:400;
}
.why p{
  margin:0;
  max-width:370px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}


/* ---------- attention / humanity principle ---------- */

.why-humanity{
  display:grid;
  grid-template-columns:1fr 2.2fr;
  gap:30px;
  margin-top:34px;
  padding-top:28px;
  border-top:1px solid var(--rule);
}
.why-humanity .kicker{padding-top:6px}
.why-humanity-copy{max-width:920px}
.why-humanity-copy p{
  margin:0 0 16px;
  font-size:16px;
  line-height:1.55;
}
.why-humanity-copy p:last-child{margin-bottom:0}
.why-humanity-principle{
  max-width:900px;
  padding:22px 0 4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(2rem,4vw,4.4rem) !important;
  line-height:.98 !important;
  letter-spacing:-.04em;
}
.why-humanity-note{
  max-width:780px;
  color:var(--muted);
}
.collection-humanity-note,
.local-ethos-note{
  display:block;
  margin-top:.8em;
}
.local-ethos-note{
  color:#d7d2c7;
}
@media(max-width:850px){
  .why-humanity{
    grid-template-columns:1fr;
    gap:14px;
  }
}

/* ---------- exhibition ---------- */

.exhibition{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  border:1px solid var(--rule);
}
.exhibition-image{
  min-height:590px;
  background:var(--placeholder-bg,#d8d2c5);
  position:relative;
  overflow:hidden;
}
.exhibition-image:before{
  content:"";
  position:absolute;
  inset:28px;
  border:1px solid var(--placeholder-rule,rgba(20,20,20,.38));
}
.exhibition-image .empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:38px;
  text-align:center;
  font-size:12px;
  line-height:1.5;
  color:var(--placeholder-ink,#49463f);
}
.exhibition-image .stamp{
  position:absolute;
  top:16px;
  left:16px;
  background:var(--acid);
  color:#141414;
  border:1px solid #141414;
  padding:6px 8px 5px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:700;
}
.exhibition-copy{
  min-height:590px;
  background:#fffdf8;
  padding:27px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.exhibition-copy h3{
  margin:10px 0 24px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(3rem,5.6vw,6rem);
  line-height:.86;
  letter-spacing:-.055em;
  font-weight:400;
}
.exhibition-copy .dek{
  max-width:480px;
  font-size:18px;
  line-height:1.4;
}
.meta-table{
  border-top:1px solid var(--rule);
}
.meta-row{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid var(--soft-rule);
  font-size:13px;
}
.meta-row strong{
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.06em;
}

/* ---------- collection ---------- */

.collection-intro{
  display:grid;
  grid-template-columns:1fr 2.2fr;
  gap:30px;
  margin-bottom:38px;
}
.collection-intro p{
  grid-column:2;
  margin:0;
  max-width:850px;
  font-size:20px;
  line-height:1.35;
  letter-spacing:-.02em;
}
.collection-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--rule);
  border-left:1px solid var(--rule);
}
.collection-item{
  min-height:285px;
  padding:17px;
  border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
}
.collection-item:hover{background:#fffdf8}
.collection-item .code{
  font-family:"Courier New",monospace;
  font-size:11px;
  padding-right:54px;
}
.collection-icon{
  position:absolute;
  top:15px;
  right:16px;
  width:38px;
  height:38px;
  color:var(--ink);
  opacity:.62;
  fill:none;
  stroke:currentColor;
  stroke-width:1.45;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  transition:color .15s ease, opacity .15s ease, transform .15s ease;
}
.collection-item:hover .collection-icon{
  color:var(--blue);
  opacity:1;
  transform:translateY(-1px);
}
.collection-item h3{
  margin:0 0 11px;
  font-size:clamp(1.9rem,3vw,3.3rem);
  line-height:.93;
  letter-spacing:-.05em;
}
.collection-item p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

/* ---------- field instruction ---------- */

.field{
  background:var(--acid);
  border-bottom:1px solid var(--rule);
  padding:74px 0 80px;
}
.field .kicker{margin-bottom:27px}
.field blockquote{
  margin:0;
  max-width:1350px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(3.3rem,7.5vw,8.5rem);
  line-height:.86;
  letter-spacing:-.06em;
  font-weight:400;
}
.field blockquote strong{
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  letter-spacing:-.07em;
}

/* ---------- field notes / editorial ---------- */

.notes-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}
.note{
  border-top:4px solid var(--ink);
  padding-top:13px;
}
.note .type{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700;
}
.note h3{
  margin:23px 0 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(2rem,3vw,3.2rem);
  line-height:.96;
  font-weight:400;
  letter-spacing:-.035em;
}
.note p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  max-width:430px;
}


/* ---------- data / AI ethics ---------- */

.data-ethics{
  background:var(--inverse-bg);
  color:var(--inverse-ink);
}

.data-ethics .section-title{
  margin-bottom:40px;
}

.data-ethics .section-title h2{
  max-width:1200px;
}

.data-ethics .section-title .kicker,
.data-ethics .ethics-kicker{
  color:var(--acid);
}

.ethics-intro{
  display:grid;
  grid-template-columns:1fr 2.2fr;
  gap:30px;
  margin-bottom:44px;
}

.ethics-intro-copy{
  grid-column:2;
  max-width:900px;
}

.ethics-intro-copy p{
  margin:0 0 16px;
  color:#d8d3ca;
  font-size:18px;
  line-height:1.5;
}

.ethics-intro-copy p:last-child{
  margin-bottom:0;
}

.ethics-principle{
  margin:0 0 46px;
  padding:24px;
  border:1px solid rgba(244,241,232,.7);
}

.ethics-principle .kicker{
  color:var(--acid);
  margin-bottom:20px;
}

.ethics-principle p{
  margin:0;
  max-width:1100px;
