name: Finish Library migration

on:
  push:
    paths:
      - '.github/workflows/finish-library-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace remaining Café references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import glob, json

          path = Path('index.html')
          text = path.read_text()

          replacements = {
              '<a href="./cafe/">Collection Lounge / Café</a>': '<a href="./library/">Library / Reading Room</a>',
              'Need a minute? <a class="text-link" href="./cafe/">Sit in the Collection Lounge →</a>': 'Need a minute? <a class="text-link" href="./library/">Sit in the Library →</a>',
              '<!-- The café has no door. It does have coffee. -->': '<!-- The Library keeps quiet hours. The keyboard does not. -->',
              "const cafeWords = ['cafe', 'coffee', 'rest'];": "const libraryWords = ['library', 'reading', 'cafe', 'coffee', 'rest'];",
              'cafeWords.map': 'libraryWords.map',
              'let cafeBuffer =': 'let libraryBuffer =',
              'cafeBuffer = (cafeBuffer + key)': 'libraryBuffer = (libraryBuffer + key)',
              'cafeBuffer.endsWith': 'libraryBuffer.endsWith',
              "cafeBuffer = '';": "libraryBuffer = '';",
              "window.location.href = './cafe/';": "window.location.href = './library/';",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          core = json.loads(Path('data/helpdesk-core.json').read_text())
          entries = []
          for entry_path in sorted(glob.glob('data/helpdesk-entries-*.json')):
              entries.extend(json.loads(Path(entry_path).read_text()))
          core['entries'] = entries
          Path('data/helpdesk.json').write_text(json.dumps(core, ensure_ascii=False, indent=2) + '\n')

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('└── cafe/\n    ├── index.html\n    ├── cafe.css\n    ├── cafe.js\n    ├── README.md\n    └── data/\n        ├── scenes.json\n        └── scene.example.json',
                        '├── library/\n│   ├── index.html\n│   ├── library.css\n│   ├── library.js\n│   └── data/\n│       └── shelves.json\n└── cafe/\n    └── index.html  # compatibility redirect to /library/')
          r = r.replace("The Help Desk currently matches questions locally in the visitor's browser. The Café reads its display program from `cafe/data/scenes.json`.",
                        "The Help Desk currently matches questions locally in the visitor's browser. The Library / Reading Room lives at `/library/`; the old `/cafe/` route redirects there for compatibility.")
          readme.write_text(r)
          PY

          # The old Café URL remains only as a deliberate compatibility redirect
          # and legacy Help Desk aliases/questions.
          if grep -nE 'href="\./cafe/"|window\.location\.href = '\''\./cafe/'\''' index.html; then
            echo 'Active Café link remains in index.html' >&2
            exit 1
          fi

          node --check js/helpdesk.js
          node --check js/helpdesk-core.js
          node --check library/library.js
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          for p in ['data/helpdesk-core.json', 'data/helpdesk.json', 'data/helpdesk-entries-01.json', 'data/helpdesk-entries-02.json', 'data/helpdesk-entries-03.json', 'data/helpdesk-entries-04.json', 'data/helpdesk-entries-05.json', 'library/data/shelves.json']:
              json.load(open(p))
          ET.parse('sitemap.xml')
          PY

          rm -f .github/workflows/finish-library-migration.yml

      - name: Commit finished migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Café to Library migration'
          git push
