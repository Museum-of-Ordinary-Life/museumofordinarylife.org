name: Flatten site for GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/flatten-static-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build plain static tree
        shell: bash
        run: |
          set -euo pipefail

          test -f _includes/current/site-01.html
          test -f _includes/current/helpdesk-js-00.html
          test -f _includes/current/cafe-css-00.html

          cat _includes/current/site-*.html > index.html
          cat _includes/current/helpdesk-js-*.html > js/helpdesk.js
          cat _includes/current/cafe-css-*.html > cafe/cafe.css

          python - <<'PY'
          import glob, json
          from pathlib import Path

          core = json.loads(Path('data/helpdesk-core.json').read_text())
          entries = []
          for path in sorted(glob.glob('data/helpdesk-entries-*.json')):
              entries.extend(json.loads(Path(path).read_text()))
          core['entries'] = entries
          Path('data/helpdesk.json').write_text(
              json.dumps(core, ensure_ascii=False, indent=2) + '\n'
          )
          PY

          # Preserve the current Museum icons from the still-live Fastmail site
          # before the DNS cutover.
          curl --fail --location --retry 3 \
            https://museumofordinarylife.org/favicon.png \
            --output favicon.png
          curl --fail --location --retry 3 \
            https://museumofordinarylife.org/apple-touch-icon.png \
            --output apple-touch-icon.png

          cat > robots.txt <<'EOF'
          # Museum of Ordinary Life
          # https://museumofordinarylife.org/
          #
          # Human visitors and ordinary search/discovery are welcome.
          # Automated access does not imply permission for model training or unrestricted reuse.

          User-agent: *
          Allow: /

          User-agent: OAI-SearchBot
          Allow: /

          User-agent: GPTBot
          Disallow: /

          User-agent: Claude-User
          Allow: /

          User-agent: Claude-SearchBot
          Allow: /

          User-agent: ClaudeBot
          Disallow: /

          User-agent: Google-Extended
          Disallow: /

          User-agent: CCBot
          Disallow: /

          Sitemap: https://museumofordinarylife.org/sitemap.xml
          EOF

          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://museumofordinarylife.org/</loc>
              <lastmod>2026-08-11</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://museumofordinarylife.org/cafe/</loc>
              <lastmod>2026-08-11</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>
          EOF

          touch .nojekyll

          cat > README.md <<'EOF'
          # Museum of Ordinary Life — website

          Public static website for **museumofordinarylife.org**.

          The repository root mirrors the deployed web root. There is no framework and no build step required for normal editing.

          ```text
          /
          ├── index.html
          ├── CNAME
          ├── .nojekyll
          ├── robots.txt
          ├── sitemap.xml
          ├── favicon.png
          ├── apple-touch-icon.png
          ├── data/
          │   └── helpdesk.json
          ├── js/
          │   └── helpdesk.js
          └── cafe/
              ├── index.html
              ├── cafe.css
              ├── cafe.js
              ├── README.md
              └── data/
                  ├── scenes.json
                  └── scene.example.json
          ```

          Clone with GitHub Desktop or Git, edit in VS Code, preview with a local static server, then commit and push to `main` when ready to publish.

          The Help Desk currently matches questions locally in the visitor's browser. The Café reads its display program from `cafe/data/scenes.json`.
          EOF

          rm -rf _includes assets
          rm -f _config.yml
          rm -f data/helpdesk-core.json data/helpdesk-entries-*.json

          # Validate the exact files that will be committed.
          node --check js/helpdesk.js
          node --check cafe/cafe.js
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          json.load(open('data/helpdesk.json'))
          json.load(open('cafe/data/scenes.json'))
          json.load(open('cafe/data/scene.example.json'))
          ET.parse('sitemap.xml')
          PY

          python -m http.server 8765 >/tmp/mool-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail http://127.0.0.1:8765/ >/dev/null
          curl --fail http://127.0.0.1:8765/cafe/ >/dev/null
          curl --fail http://127.0.0.1:8765/data/helpdesk.json >/dev/null
          curl --fail http://127.0.0.1:8765/robots.txt >/dev/null
          kill "$server_pid"
          trap - EXIT

          # This workflow is only migration scaffolding; remove it from the
          # finished repository so the final tree stays simple.
          rm -f .github/workflows/flatten-static-site.yml

      - name: Commit flattened site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flatten site for GitHub Pages'
          git push
