name: Fix Library shortcut rename

on:
  push:
    paths:
      - '.github/workflows/fix-library-shortcut.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and validate shortcut
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text().replace('if (cafeWords.some(word => libraryBuffer.endsWith(word))) {', 'if (libraryWords.some(word => libraryBuffer.endsWith(word))) {')
          p.write_text(text)
          PY
          ! grep -n 'cafeWords' index.html
          rm -f .github/workflows/fix-library-shortcut.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Library keyboard shortcut migration'
          git push
